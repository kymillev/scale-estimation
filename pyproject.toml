[project]
name = "scale-estimation"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "annoy>=1.17.3",
    "flash-attn==2.8.3.post1+cu.13.0.torch.2.12",
    "h5py>=3.16.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "lomatch",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "opencv-python>=4.12.0.88",
    "paddleocr>=3.7.0",
    "pandas>=2.2.0",
    "pillow>=12.0.0",
    "plotly>=7.0.0",
    "pyarrow>=18.0.0",
    "pycocotools>=2.0.11",
    "rfdetr>=1.9.1",
    "seaborn>=0.13.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
lightglue = [
    "lightglue",
]
clip = [
    "open-clip-torch>=3.3.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
flash-attn = { index = "astral-cu130" }
lomatch = { git = "https://github.com/davnords/LoMa", rev = "5e541b8e39b5e0b2fd7d6b74ced583061a3e805a" }
lightglue = { git = "https://github.com/cvg/LightGlue.git", rev = "eb42fee2d71449efb0aa5c10549752b5d75384d8" }

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
